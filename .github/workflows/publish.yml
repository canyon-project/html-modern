name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

#      - name: Typecheck
#        run: pnpm typecheck
#
#      - name: Test
#        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@canyonjs/html-modern@${VERSION}" version >/dev/null 2>&1; then
            echo "Version ${VERSION} is already published. Bump package.json version to release."
            exit 0
          fi
          npm publish --access public --provenance
